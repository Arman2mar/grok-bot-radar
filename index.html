<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Bot Radar — Bitácora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151A;
    --card: #1B2027;
    --card-hover: #20262E;
    --text: #E8EAED;
    --text-dim: #9AA1AC;
    --text-mut: #5C6370;
    --accent: #E8A33D;
    --accent-text: #2E1F05;
    --success: #5FBF8F;
    --success-text: #0E2B1D;
    --danger: #E2504F;
    --border: #262C34;
    --border-strong: #333B45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }

  header { margin-bottom: 20px; }
  header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 6px;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 6px;
  }
  header p {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    line-height: 1.5;
  }

  .stats-row {
    display: flex;
    gap: 8px;
    margin: 18px 0;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .stats-row::-webkit-scrollbar { display: none; }
  .stat-chip {
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .stat-chip b { color: var(--text); font-weight: 600; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel-toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .panel-toggle h2 {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    margin: 0;
  }
  .panel-toggle span {
    font-size: 18px;
    color: var(--text-dim);
    transition: transform 0.15s ease;
  }
  .panel-toggle.open span { transform: rotate(45deg); }

  form { margin-top: 14px; display: none; flex-direction: column; gap: 10px; }
  form.open { display: flex; }

  label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; display: block; }
  select, input[type="text"], input[type="url"], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 60px; }
  .field-error { font-size: 12px; color: var(--danger); margin-top: 3px; display: none; }
  .field-error.show { display: block; }

  .btn {
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:active { opacity: 0.85; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
  }

  .filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-bottom: 14px;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .search-box { margin-bottom: 14px; }

  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--cat-color, var(--border-strong));
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .entry-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--cat-color, var(--text-dim));
    margin-bottom: 4px;
    display: block;
  }
  .entry-title {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .entry-note {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin: 0 0 6px;
    white-space: pre-wrap;
  }
  .entry-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }
  .entry-date { font-size: 11px; color: var(--text-mut); }
  .entry-link {
    font-size: 12px;
    color: var(--success);
    text-decoration: none;
  }
  .entry-del {
    background: none;
    border: none;
    color: var(--text-mut);
    font-size: 12px;
    cursor: pointer;
    padding: 4px;
  }
  .entry-del:active { color: var(--danger); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-mut);
    font-size: 13px;
  }
  .loading { text-align: center; padding: 30px; color: var(--text-mut); font-size: 13px; }

  .footer-note {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-mut);
    text-align: center;
  }
  .footer-note button {
    background: none;
    border: none;
    color: var(--text-mut);
    text-decoration: underline;
    cursor: pointer;
    font-size: 11px;
    padding: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">grok bot radar / bitácora</p>
    <h1>Radar de hallazgos</h1>
    <p>Registra lo que encuentres sobre el ecosistema de Grok Bot: funciones, comunidad, workflows, comparaciones, bots y oportunidades de inversión.</p>
  </header>

  <div class="stats-row" id="statsRow"></div>

  <div class="panel">
    <div class="panel-toggle" id="formToggle">
      <h2>Nuevo hallazgo</h2>
      <span>+</span>
    </div>
    <form id="entryForm">
      <div>
        <label for="catSelect">Categoría</label>
        <select id="catSelect"></select>
      </div>
      <div>
        <label for="titleInput">Título</label>
        <input type="text" id="titleInput" placeholder="Nombre de la función, bot o hallazgo">
        <div class="field-error" id="titleError">Escribe un título antes de guardar.</div>
      </div>
      <div>
        <label for="noteInput">Nota</label>
        <textarea id="noteInput" placeholder="Qué es, por qué importa, qué se puede hacer con esto"></textarea>
      </div>
      <div>
        <label for="linkInput">Enlace (opcional)</label>
        <input type="url" id="linkInput" placeholder="https://...">
      </div>
      <button type="submit" class="btn btn-primary">Guardar hallazgo</button>
    </form>
  </div>

  <div class="filters" id="filterRow"></div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar en tus hallazgos">
  </div>

  <div id="entryList"><div class="loading">Cargando bitácora…</div></div>

  <div class="footer-note">
    Guardado solo en tu cuenta. <button id="resetBtn" type="button">Borrar toda la bitácora</button>
  </div>
</div>

<script>
const CATEGORIES = [
  { id: 'funciones',     label: 'Funciones y lanzamientos',      color: '#E8A33D' },
  { id: 'comunidad',     label: 'Creaciones de la comunidad',    color: '#5FBF8F' },
  { id: 'workflows',     label: 'Workflows y guías',             color: '#7F9CF5' },
  { id: 'comparaciones', label: 'Comparaciones y pruebas',       color: '#D4537E' },
  { id: 'bots',          label: 'Bots y creadores',              color: '#B18BE0' },
  { id: 'inversion',     label: 'Inversión y monetización',      color: '#E2504F' },
  { id: 'submissions',   label: 'Submissions de la comunidad',   color: '#6B7280' },
];
const STORAGE_KEY = 'radar-entries';

let entries = [];
let activeFilter = 'all';
let searchTerm = '';

function catInfo(id) {
  return CATEGORIES.find(c => c.id === id) || { label: id, color: '#5C6370' };
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
}

async function loadEntries() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    entries = result ? JSON.parse(result.value) : [];
  } catch (err) {
    entries = [];
  }
  renderAll();
}

async function saveEntries() {
  try {
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
    if (!result) console.error('No se pudo guardar la bitácora');
  } catch (err) {
    console.error('Error guardando:', err);
  }
}

function renderStats() {
  const row = document.getElementById('statsRow');
  const total = entries.length;
  let html = `<div class="stat-chip"><b>${total}</b> total</div>`;
  CATEGORIES.forEach(c => {
    const count = entries.filter(e => e.category === c.id).length;
    if (count > 0) {
      html += `<div class="stat-chip" style="color:${c.color}"><b>${count}</b> ${c.label.split(' ')[0]}</div>`;
    }
  });
  row.innerHTML = html;
}

function renderFilters() {
  const row = document.getElementById('filterRow');
  let html = `<button class="chip ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">Todos</button>`;
  CATEGORIES.forEach(c => {
    html += `<button class="chip ${activeFilter === c.id ? 'active' : ''}" data-filter="${c.id}" style="${activeFilter === c.id ? `background:${c.color};border-color:${c.color}` : ''}">${c.label}</button>`;
  });
  row.innerHTML = html;
  row.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.filter;
      renderFilters();
      renderList();
    });
  });
}

function renderCatOptions() {
  const select = document.getElementById('catSelect');
  select.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
}

function renderList() {
  const container = document.getElementById('entryList');
  let filtered = entries.filter(e => activeFilter === 'all' || e.category === activeFilter);
  if (searchTerm.trim()) {
    const term = searchTerm.toLowerCase();
    filtered = filtered.filter(e =>
      e.title.toLowerCase().includes(term) || (e.note && e.note.toLowerCase().includes(term))
    );
  }
  filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty">Todavía no hay hallazgos aquí. Añade el primero arriba.</div>`;
    return;
  }

  container.innerHTML = filtered.map(e => {
    const cat = catInfo(e.category);
    return `
      <div class="entry" style="--cat-color:${cat.color}">
        <div class="entry-top">
          <div style="flex:1">
            <span class="entry-cat">${cat.label}</span>
            <p class="entry-title">${escapeHtml(e.title)}</p>
          </div>
          <button class="entry-del" data-id="${e.id}" aria-label="Eliminar">eliminar</button>
        </div>
        ${e.note ? `<p class="entry-note">${escapeHtml(e.note)}</p>` : ''}
        <div class="entry-meta">
          <span class="entry-date">${formatDate(e.date)}</span>
          ${e.link ? `<a class="entry-link" href="${escapeHtml(e.link)}" target="_blank" rel="noopener">ver fuente</a>` : ''}
        </div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.entry-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      entries = entries.filter(e => e.id !== btn.dataset.id);
      await saveEntries();
      renderAll();
    });
  });
}

function renderAll() {
  renderStats();
  renderFilters();
  renderList();
}

document.getElementById('formToggle').addEventListener('click', () => {
  document.getElementById('formToggle').classList.toggle('open');
  document.getElementById('entryForm').classList.toggle('open');
});

document.getElementById('entryForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const titleInput = document.getElementById('titleInput');
  const titleError = document.getElementById('titleError');
  const title = titleInput.value.trim();

  if (!title) {
    titleError.classList.add('show');
    return;
  }
  titleError.classList.remove('show');

  const entry = {
    id: Date.now().toString(),
    category: document.getElementById('catSelect').value,
    title,
    note: document.getElementById('noteInput').value.trim(),
    link: document.getElementById('linkInput').value.trim(),
    date: new Date().toISOString(),
  };
  entries.push(entry);
  await saveEntries();

  document.getElementById('entryForm').reset();
  document.getElementById('formToggle').classList.remove('open');
  document.getElementById('entryForm').classList.remove('open');
  renderAll();
});

document.getElementById('titleInput').addEventListener('input', () => {
  document.getElementById('titleError').classList.remove('show');
});

document.getElementById('searchInput').addEventListener('input', (ev) => {
  searchTerm = ev.target.value;
  renderList();
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('¿Borrar toda la bitácora? Esto no se puede deshacer.')) return;
  entries = [];
  await saveEntries();
  renderAll();
});

renderCatOptions();
loadEntries();
</script>
</body>
  </html>
